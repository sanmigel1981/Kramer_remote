name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython
      
      - name: Setup NDK 25b and remove old NDK
        run: |
          # Скачиваем NDK 25b
          wget https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          # Удаляем старый NDK
          rm -rf /home/runner/.buildozer/android/platform/android-ndk-r23b
          # Создаём папку и перемещаем NDK 25b
          mkdir -p /home/runner/.buildozer/android/platform/
          mv android-ndk-r25b /home/runner/.buildozer/android/platform/android-ndk-r25b
          # Устанавливаем переменную окружения
          echo "ANDROIDNDK=/home/runner/.buildozer/android/platform/android-ndk-r25b" >> $GITHUB_ENV
      
      - name: Build APK with Buildozer
        run: |
          buildozer android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kramer-remote-apk
          path: bin/*.apk